<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1115">
<title>股票翻倍計畫</title>
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb;
  --good: #0a8f5a; --good-bg: #e3f6ed; --warn: #b26a00; --warn-bg: #fff3dc;
  --bad: #c62828; --bad-bg: #fde8e8; --info: #2457c5; --info-bg: #e6eeff; --bar: #d9dde3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --card: #181b21; --text: #eceef2; --muted: #9aa1ad; --line: #2a2f38;
    --good: #3ccf8e; --good-bg: #133326; --warn: #f0b04a; --warn-bg: #3a2c12;
    --bad: #ff6b6b; --bad-bg: #3d1a1a; --info: #7aa2ff; --info-bg: #1a2644; --bar: #2a2f38;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
main { max-width: 640px; margin: 0 auto; padding: 12px 16px 40px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 10px; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 15px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
.badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.b-close { color: var(--good); background: var(--good-bg); }
.b-intraday { color: var(--warn); background: var(--warn-bg); }
.meta { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.banner { border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 14px; font-weight: 600; }
.banner.bad { color: var(--bad); background: var(--bad-bg); }
.banner.warn { color: var(--warn); background: var(--warn-bg); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
.swap { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.swap:first-of-type { border-top: 0; }
.swap .arrow { color: var(--muted); }
.swap .tk { font-weight: 700; }
.small { font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 6px; margin: 4px 0 10px; }
.tab { flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px;
  padding: 9px 0; font: inherit; font-weight: 600; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 6px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px;
  padding: 4px 11px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--info); background: var(--info-bg); border-color: transparent; font-weight: 600; }
.row { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
.row > button { all: unset; display: grid; grid-template-columns: 1fr auto 52px; align-items: center; gap: 10px;
  width: 100%; padding: 11px 12px; cursor: pointer; box-sizing: border-box; }
.tkr { font-weight: 700; font-size: 16px; }
.sub { font-size: 12px; color: var(--muted); }
.score { text-align: right; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
.score small { display: block; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.up { color: var(--bad); } .down { color: var(--good); } /* 台股習慣：紅漲綠跌 */
.pill { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.p-good { color: var(--good); background: var(--good-bg); }
.p-warn { color: var(--warn); background: var(--warn-bg); }
.p-bad { color: var(--bad); background: var(--bad-bg); }
.p-info { color: var(--info); background: var(--info-bg); }
.p-mute { color: var(--muted); background: var(--bg); }
.detail { padding: 0 12px 12px; display: none; }
.row.open .detail { display: block; }
.comp { display: grid; grid-template-columns: 64px 1fr 34px; gap: 8px; align-items: center; font-size: 13px; margin: 5px 0; }
.track { height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; }
.fill { height: 100%; border-radius: 3px; background: var(--info); }
.fill.risk { background: var(--bad); }
.comp b { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.tag { font-size: 12px; padding: 2px 7px; border-radius: 6px; background: var(--bg); color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
details { margin-top: 16px; color: var(--muted); font-size: 13px; }
details summary { cursor: pointer; font-weight: 600; }
details p { margin: 6px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>股票翻倍計畫</h1>
    <span id="mode" class="badge"></span>
  </header>
  <div id="meta" class="meta">載入中…</div>
  <div id="banners"></div>

  <section class="card" id="swapCard">
    <h2>換股訊號</h2>
    <div id="swaps"></div>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabH" aria-selected="true">持股</button>
    <button class="tab" role="tab" id="tabC" aria-selected="false">候選</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>

  <details>
    <summary>分數怎麼算</summary>
    <p>總分 0–100：相對強弱 30、資金流 25、趨勢 20、反彈 15，風險最多扣 10 分。</p>
    <p>持股：強勢續抱 ≥75、續抱、轉弱留意 &lt;50、出場訊號 &lt;40 且跌破 50 日線。候選：可進場 ≥70 且趨勢夠強、觀察 ≥60。</p>
    <p>換股：候選股比最弱持股高 15 分以上，連續 3 個收盤日才成立。盤中顯示的是暫定結果，收盤後才確認。標「自動」的持股由程式挑選，換股時會自動汰換；你自己指定的只提醒不換。</p>
  </details>
</main>
<script>
const SIG_CLASS = { strong: "p-good", hold: "p-mute", reduce: "p-warn", exit: "p-bad", swap_out: "p-bad",
  buy: "p-good", watch: "p-info", none: "p-mute", swap_in: "p-info" };
const COMP = [["rs", "相對強弱"], ["mf", "資金流"], ["trend", "趨勢"], ["rebound", "反彈"], ["risk", "風險"]];
let data = null, tab = "h", theme = "全部";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function load() {
  try {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    render();
  } catch (e) {
    $("meta").textContent = "讀不到資料，稍後會自動重試。";
  }
}

function render() {
  const m = $("mode");
  m.textContent = data.mode_label;
  m.className = "badge " + (data.mode === "close" ? "b-close" : "b-intraday");

  const gen = new Date(data.generated_at);
  const local = gen.toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
  $("meta").textContent = `更新於 ${local}（美東 ${data.generated_at_et.slice(5, 16)}）・資料日 ${data.data_date}`;

  const b = [];
  const ageMin = (Date.now() - gen.getTime()) / 60000;
  if (ageMin > data.stale_after_minutes)
    b.push(`<div class="banner bad">資料已 ${fmtAge(ageMin)} 沒更新，電腦或排程可能停了。</div>`);
  if (data.demo) b.push(`<div class="banner warn">目前顯示的是模擬資料，不是真實行情。</div>`);
  if (data.errors?.length) b.push(`<div class="banner warn">${data.errors.length} 檔抓不到資料：${data.errors.map(e => esc(e.ticker)).join("、")}</div>`);
  $("banners").innerHTML = b.join("");

  renderSwaps();
  renderList();
}

function fmtAge(min) {
  if (min < 120) return Math.round(min) + " 分鐘";
  if (min < 2880) return Math.round(min / 60) + " 小時";
  return Math.round(min / 1440) + " 天";
}

function renderSwaps() {
  const rows = [];
  for (const s of data.swaps || []) {
    const pill = s.status === "confirmed" ? `<span class="pill p-good">已確認</span>` : `<span class="pill p-warn">暫定</span>`;
    rows.push(`<div class="swap">${pill}<span class="tk">${esc(s.out)}</span><span class="arrow">→</span>
      <span class="tk">${esc(s.in)}</span><span class="small">高 ${s.gap} 分・連續 ${s.streak} 天</span></div>`);
  }
  const building = (data.candidates || []).filter(c => c.swap?.status === "building")
    .sort((a, b) => b.swap.streak - a.swap.streak).slice(0, 3);
  for (const c of building)
    rows.push(`<div class="swap"><span class="pill p-mute">累積中 ${c.swap.streak}/${c.swap.need}</span>
      <span class="tk">${esc(c.ticker)}</span><span class="small">比 ${esc(c.swap.out)} 高 ${c.swap.gap} 分</span></div>`);
  const changes = (data.portfolio_changes || []).filter(c => c.action === "swap").slice(0, 3);
  for (const c of changes)
    rows.push(`<div class="swap"><span class="pill p-info">已換股</span><span class="tk">${esc(c.out)}</span>
      <span class="arrow">→</span><span class="tk">${esc(c.in)}</span><span class="small">${esc(c.date)}</span></div>`);
  $("swaps").innerHTML = rows.join("") || `<div class="empty">目前沒有換股訊號。</div>`;
}

function renderList() {
  const items = tab === "h" ? data.holdings : data.candidates;
  const themes = ["全部", ...new Set(items.map(i => i.theme).filter(Boolean))];
  if (!themes.includes(theme)) theme = "全部";
  $("chips").innerHTML = themes.map(t =>
    `<button class="chip" aria-pressed="${t === theme}" data-theme="${esc(t)}">${esc(t)}</button>`).join("");
  const shown = items.filter(i => theme === "全部" || i.theme === theme);
  $("list").innerHTML = shown.map(rowHtml).join("") || `<div class="empty">沒有資料。</div>`;
}

function rowHtml(i) {
  const chg = i.chg_1d_pct;
  const chgCls = chg > 0 ? "up" : chg < 0 ? "down" : "";
  const sub = [i.theme, i.source === "auto" ? "自動" : i.source === "manual" ? "自選" : "", i.weakest ? "最弱" : ""]
    .filter(Boolean).join("・");
  const comps = COMP.map(([k, label]) => {
    const v = i.components[k];
    return `<div class="comp"><span>${label}</span><div class="track"><div class="fill${k === "risk" ? " risk" : ""}"
      style="width:${Math.max(0, Math.min(100, v))}%"></div></div><b>${Math.round(v)}</b></div>`;
  }).join("");
  const tags = (i.reasons || []).map(r => `<span class="tag">${esc(r)}</span>`).join("");
  return `<div class="row"><button aria-expanded="false">
      <div><div class="tkr">${esc(i.ticker)}</div><div class="sub">${esc(sub)}</div></div>
      <span class="pill ${SIG_CLASS[i.signal] || "p-mute"}">${esc(i.signal_label)}</span>
      <div class="score">${Math.round(i.score)}<small class="${chgCls}">${chg > 0 ? "+" : ""}${chg.toFixed(1)}%</small></div>
    </button><div class="detail">${comps}${tags ? `<div class="tags">${tags}</div>` : ""}</div></div>`;
}

$("list").addEventListener("click", e => {
  const btn = e.target.closest(".row > button");
  if (!btn) return;
  const row = btn.parentElement;
  row.classList.toggle("open");
  btn.setAttribute("aria-expanded", row.classList.contains("open"));
});
$("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip");
  if (c) { theme = c.dataset.theme; renderList(); }
});
for (const [id, t] of [["tabH", "h"], ["tabC", "c"]])
  $(id).addEventListener("click", () => {
    tab = t; theme = "全部";
    $("tabH").setAttribute("aria-selected", t === "h");
    $("tabC").setAttribute("aria-selected", t === "c");
    if (data) renderList();
  });

load();
setInterval(load, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>

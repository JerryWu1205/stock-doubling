# 股票翻倍計畫：掃描器設定檔
# 用記事本打開就能改。改完存檔，下一次掃描自動生效。
# 分成 [us] 美股、[tw] 台股兩段，各自有持股和候選池；評分權重和換股規則共用。
# 不想跑某個市場，在那一段加一行 enabled = false。

# 汰弱留強規則：候選股分數比最弱的持股高出 swap_gap 分，
# 連續 swap_days 個「收盤確認」交易日，才發出換股訊號。
swap_gap = 15
swap_days = 3

# 出場規則（2026-10-20 統一）：網頁「我的」、Telegram 持股報告、模擬倉都照這一套，不再每天換。
#   收盤跌破成本 −stop_pct%：全部賣出
#   收盤跌破吊燈停損（近 22 天最高收盤 − 3 倍 ATR）：賣一半（同一筆持股只賣一次一半）
#   收盤在 50 日線下：續抱，但不買進、不加碼
[exit]
stop_pct = 8

# Telegram 通知：透過 AI情報官 的 Bot 發送（Token 直接讀 AI情報官 的 .env）。
# 不想收通知就把 enabled 改成 false。
[notify]
enabled = true
env_file = "../ai-intel-officer/.env"
page_url = "https://jerrywu1205.github.io/stock-doubling/"

# 評分權重（百分比）。risk 是扣分項：風險越高扣越多，最多扣 risk 分。
[weights]
relative_strength = 30
money_flow = 25
trend = 20
rebound = 15
risk = 10


# ═════════════ 美股 ═════════════
[us]
benchmark = "SPY"   # 比較相對強弱用的大盤基準

# ───── 持股（目標 5 檔）─────
# tickers：你自己指定的持股，程式不會自動換掉，只會發訊號。想加就直接加在這裡。
# 其餘名額由程式從候選池挑分數最高的補滿，之後依汰弱留強規則自動換股。
# 自動挑的名單存在 state/us/portfolio.json，網頁上會標「自動」。
[us.holdings]
tickers = []
target_count = 5    # 持股總檔數（2026-10-18 你要求最多 5 檔，比較好管理）
max_per_theme = 2   # 自動挑選時，每個主題最多幾檔，避免全押同一族群

# ───── 候選池 ─────
# 可以新增或刪除代號、主題。從這裡刪掉的代號，若在自動持股中也會一併移除。
